log:
  level: INFO

accessLog: {}

providers:
  file:
    filename: /etc/traefik/dynamic.yaml

entryPoints:
  web:
    address: ":@TRAEFIK_WEB_PORT@"
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          # Redirect HTTP to the public HTTPS port.
          to: ":443"
          scheme: https

  websecure:
    # Port 8444 is published by the pod as public TCP/443. The NetBird proxy
    # itself uses 8443 in this shared pod network namespace.
    address: ":@TRAEFIK_WEBSECURE_PORT@"
    allowACMEByPass: true
    http:
      aliasHeadersStrategy: delete
    # Preserve long-lived gRPC streams and proxy connections.
    transport:
      respondingTimeouts:
        readTimeout: 0s
        writeTimeout: 0s
        idleTimeout: 0s

certificatesResolvers:
  letsencrypt:
    acme:
      email: "@ACME_EMAIL@"
      storage: /letsencrypt/acme.json
      tlsChallenge: {}

serversTransport:
  forwardingTimeouts:
    responseHeaderTimeout: 0s
    idleConnTimeout: 0s
