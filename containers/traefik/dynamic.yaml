http:
  routers:
    # gRPC router: the backend must use h2c for cleartext HTTP/2.
    netbird-grpc:
      rule: 'Host(`@DOMAIN@`) && (PathPrefix(`/signalexchange.SignalExchange/`) || PathPrefix(`/management.ManagementService/`) || PathPrefix(`/management.ProxyService/`))'
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: netbird-server-h2c
      priority: 100

    # HTTP backend: relay, WebSocket, API and embedded IdP.
    netbird-backend:
      rule: 'Host(`@DOMAIN@`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`) || PathPrefix(`/api`) || PathPrefix(`/oauth2`))'
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: netbird-server
      priority: 100

    # Dashboard catch-all for the NetBird management hostname.
    netbird-dashboard:
      rule: 'Host(`@DOMAIN@`)'
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: dashboard
      priority: 1

  services:
    netbird-server:
      loadBalancer:
        servers:
          - url: "http://netbird-server:@SERVER_PORT@"

    netbird-server-h2c:
      loadBalancer:
        servers:
          - url: "h2c://netbird-server:@SERVER_PORT@"

    dashboard:
      loadBalancer:
        servers:
          - url: "http://netbird-dashboard:80"

tcp:
  routers:
    # Send service hostnames to the NetBird proxy unchanged. Exclude both
    # NetBird management and Pocket ID, which are routed by HTTP routers above.
    netbird-proxy-passthrough:
      rule: 'HostSNI(`*`) && !HostSNI(`@DOMAIN@`) && !HostSNI(`@POCKET_ID_DOMAIN@`)'
      entryPoints:
        - websecure
      service: netbird-proxy
      priority: 1
      tls:
        passthrough: true

  services:
    netbird-proxy:
      loadBalancer:
        servers:
          - address: "netbird-proxy:@PROXY_PORT@"
        serversTransport: pp-v2@file

  # Traefik sends PROXY protocol v2 so the NetBird proxy can recover the
  # original client's address after the TLS passthrough hop.
  serversTransports:
    pp-v2:
      proxyProtocol:
        version: 2
