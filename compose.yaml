services:
  adminer:
    image: docker.io/library/adminer
    container_name: adminer
    ports:
      - "8080:8080"
    networks:
      - app-net
    environment:
      ADMINER_DRIVER: pgsql
      ADMINER_SERVER: postgres
      ADMINER_USERNAME: postgres
      ADMINER_PASSWORD: secure_super_password
      ADMINER_DB: whatphilipstores_db
    volumes:
      - ./config/adminer/autologin.php:/var/www/html/plugins-enabled/autologin.php:z
    depends_on:
      postgres:
        condition: service_healthy
  
  postgres:
    build:
      context: ./apps/postgres
      dockerfile: Containerfile
    container_name: local-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: secure_super_password
      DB_PASSWORD_APP: localdev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./config/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:Z
    networks:
      - app-net

  timetracker-migrator:
    image: timetracker-dev-image
    pull_policy: build
    build:
      context: ./apps/timetracker
      dockerfile: Containerfile
      target: dev
    container_name: local-timetracker-migrator
    command: ["sh", "-c", "pnpm run build:scripts && node bin/migrate.mjs"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: whatphilipstores_db
      DB_SCHEMA: timetracking
      DB_USER: postgres
      DB_PASSWORD: secure_super_password
    volumes:
      - ./apps/timetracker:/app:z
      - timetracker_node_modules:/app/node_modules
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy

  timetracker:
    image: timetracker-dev-image
    pull_policy: build
    build:
      context: ./apps/timetracker
      dockerfile: Containerfile
      target: dev
    container_name: local-timetracker
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: whatphilipstores_db
      DB_SCHEMA: timetracking
      DB_USER: timetracker
      DB_PASSWORD: localdev_password
      API_ACCESS_TOKEN: local_dev_token
    volumes:
      - ./apps/timetracker:/app:z
      - timetracker_node_modules:/app/node_modules
    networks:
      - app-net
    depends_on:
      timetracker-migrator:
        condition: service_completed_successfully

  vectorizer:
    build:
      context: ./apps/vectorizer
      dockerfile: Containerfile
      target: dev
    container_name: local-vectorizer
    ports:
      - "8000:8000"
    volumes:
      - ./apps/vectorizer:/usr/src/app:z
      - /usr/src/app/target
    networks:
      - app-net

volumes:
  postgres_data:
  timetracker_node_modules:

networks:
  app-net:
    driver: bridge