x-git-env: &git-env
  GIT_CONFIG_COUNT: "4"
  GIT_CONFIG_KEY_0: user.name
  GIT_CONFIG_VALUE_0: ${GIT_USER_NAME:?set GIT_USER_NAME in .env}
  GIT_CONFIG_KEY_1: user.email
  GIT_CONFIG_VALUE_1: ${GIT_USER_EMAIL:?set GIT_USER_EMAIL in .env}
  GIT_CONFIG_KEY_2: pull.rebase
  GIT_CONFIG_VALUE_2: "true"
  GIT_CONFIG_KEY_3: pull.autostash
  GIT_CONFIG_VALUE_3: "true"

x-base-config: &base
  tty: true
  networks:
    - app_net

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: whatphilipstores_db
  DB_USER: postgres
  DB_PASSWORD: secure_super_password

networks:
  app_net:
    driver: bridge

volumes:
  postgres_data:
  shared_model_weights:
  dev_time_node_modules:
  dev_time_codium:
  dev_time_vscode:
  dev_time_ssh:
  dev_inferno_codium:
  dev_inferno_vscode:
  dev_inferno_target:
  dev_inferno_ssh:

services:
  adminer:
    <<: *base
    container_name: adminer
    image: docker.io/library/adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DRIVER: pgsql
      ADMINER_SERVER: postgres
      ADMINER_USERNAME: postgres
      ADMINER_PASSWORD: secure_super_password
      ADMINER_DB: whatphilipstores_db
    volumes:
      - ./config/adminer/autologin.php:/var/www/html/plugins-enabled/autologin.php:z
    depends_on:
      postgres:
        condition: service_healthy
  
  postgres:
    <<: *base
    container_name: dev_postgres
    image: whatphilipruns_postgres
    pull_policy: build
    build:
      context: ./apps/postgres
      dockerfile: Containerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: whatphilipstores_db
      POSTGRES_PASSWORD: secure_super_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  time_migrator:
    <<: *base
    container_name: dev_time_migrator
    image: whatphilipruns_time
    pull_policy: build
    build:
      context: ./apps/timetracker
      dockerfile: Containerfile
      target: dev
    command: ["sh", "-c", "vpr db:migrate"]
    environment:
      <<: *db-env
    volumes:
      - ./apps/timetracker:/workspace/apps/timetracker:z
      - dev_time_node_modules:/workspace/apps/timetracker/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  time:
    <<: *base
    container_name: dev_time
    image: whatphilipruns_time
    pull_policy: build
    build:
      context: ./apps/timetracker
      dockerfile: Containerfile
      target: dev
    ports:
      - "3000:3000"
      - "127.0.0.1:2222:22"
    environment:
      <<: [*git-env, *db-env]
      BETTER_AUTH_SECRET: 9aa1487d5571805b6c4bb7b0972a010dab674e98e5d3172de76794e76f3c3243
      BETTER_AUTH_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "500"
    volumes:
      - ./.git/modules/apps/timetracker:/workspace/.git/modules/apps/timetracker:z
      - ./apps/timetracker:/workspace/apps/timetracker:z
      - dev_time_node_modules:/workspace/apps/timetracker/node_modules
      - dev_time_codium:/home/vp/.vscodium-server
      - dev_time_vscode:/home/vp/.vscode-server
      - dev_time_ssh:/etc/ssh
    depends_on:
      time_migrator:
        condition: service_completed_successfully
      inferno:
        condition: service_healthy

  inferno:
    <<: *base
    container_name: dev_inferno
    image: whatphilipruns_inferno
    pull_policy: build
    build:
      context: ./apps/inferno
      dockerfile: Containerfile
      target: dev
    ports:
      - "8000:8000"
      - "127.0.0.1:2223:22"
    command: ["cargo", "watch", "--poll", "-x", "run"]
    environment:
      <<: *git-env
      MODEL_EMB: /weights/embedding/model_quint8_avx2.onnx
      MODEL_GEN: /weights/generation/model_q4.onnx
    volumes:
      - ./.git/modules/apps/inferno:/workspace/.git/modules/apps/inferno:z
      - ./apps/inferno:/workspace/apps/inferno:z
      - dev_inferno_target:/workspace/apps/inferno/target
      - shared_model_weights:/weights
      - dev_inferno_codium:/root/.vscodium-server
      - dev_inferno_vscode:/root/.vscode-server
      - dev_inferno_ssh:/etc/ssh
    depends_on:
      init_shared_models:
        condition: service_completed_successfully

  init_shared_models:
    container_name: dev_init_shared_models
    image: curlimages/curl:latest
    user: root
    entrypoint: ["/bin/sh", "/scripts/download.sh"]
    volumes:
      - ./config/shared-weights/download.sh:/scripts/download.sh:ro,z
      - shared_model_weights:/weights